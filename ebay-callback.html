<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Returning to VeloList…</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
    padding: 24px;
  }
  p { font-size: 17px; }
</style>
</head>
<body>
  <p>Finishing eBay sign-in — returning to VeloList…</p>
  <script>
    // eBay's "Auth accepted URL" / "Auth declined URL" fields require a
    // real https:// page — they don't accept a custom URL scheme directly.
    // This page is that required https:// stop: it immediately forwards
    // whatever eBay appended (the "code" on success, an error param on
    // decline) straight into the app's velolist:// scheme, which is what
    // ASWebAuthenticationSession in VeloList is actually watching for.
    window.location.replace('velolist://ebay-auth' + window.location.search);
  </script>
</body>
</html>
