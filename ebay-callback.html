<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Returning to VeloList…</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
    padding: 24px;
  }
  p { font-size: 17px; margin: 0; max-width: 320px; line-height: 1.5; }
  a.continue {
    display: inline-block;
    background: #10b981;
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <p id="status">Sign-in complete — tap below to finish connecting VeloList.</p>
  <a id="continueBtn" class="continue" href="#">Continue to VeloList</a>
  <script>
    // eBay's "Auth accepted URL" / "Auth declined URL" fields require a
    // real https:// page — they don't accept a custom URL scheme directly.
    // This page is that required https:// stop, forwarding whatever eBay
    // appended (the "code" on success, an error param on decline) into the
    // app's velolist:// scheme, which is what ASWebAuthenticationSession in
    // VeloList is actually watching for.
    //
    // iOS silently blocks a script-triggered redirect to a custom URL
    // scheme unless it happens as part of a real tap — an automatic
    // window.location.replace() here just sits there doing nothing, which
    // is why closing the sheet by hand always reported as "cancelled."
    // A real, visible link the person taps counts as that real gesture.
    var target = 'velolist://ebay-auth' + window.location.search;
    document.getElementById('continueBtn').href = target;

    // Still attempt it automatically in case this particular context does
    // allow it — if it fires, the tap below never has to happen at all.
    window.location.replace(target);
  </script>
</body>
</html>
